# Codemagic CI — the Flapp mobile shell (mobile/), both platforms.
#
# Why cloud CI: development happens on Windows; Apple requires macOS/Xcode to
# build and sign iOS apps. Android could be built locally, but keeping both on
# the same tag is what stops the two stores drifting apart.
#
#   android-debug-apk  manual     sideloadable APK, no account, no signing
#   android-release    tag        signed .aab for Play (setup in its header)
#   ios-testflight     tag        signed .ipa -> TestFlight (setup below)
#
# One-time setup (Artur, after the Apple Developer account is active):
#   1. App Store Connect -> Users and Access -> Integrations -> App Store
#      Connect API: create an API key (role: Admin). Download the .p8.
#   2. Codemagic -> Teams -> Integrations -> App Store Connect: add the key,
#      name it exactly:  appstore
#      NOTE: the key must have ADMIN access. On a fresh account the first
#      App Store distribution certificate has to be created, and only an
#      Admin key may do that; App Manager can only reuse an existing one.
#   3. Codemagic -> Teams -> Environment variables: add CERTIFICATE_PRIVATE_KEY
#      (secure) to a group named  ios_signing_creds . It is the RSA key the
#      distribution certificate is created from -- generate it once, locally:
#        openssl genrsa -out flapp_ios_distribution.key 2048
#      and paste the whole file (BEGIN ... END lines included). Keep the file:
#      the certificate is useless without it.
#   4. App Store Connect -> Apps: create the app (bundle ID ca.clarivagroups.flapp
#      -- register the identifier at developer.apple.com/account first).
#   5. Run scripts/mobile-release.sh (pushes a mobile/* tag) or start the
#      workflow manually -> build lands in TestFlight -> install on the
#      iPhone via the TestFlight app. Codemagic -> app -> Settings needs the
#      GitHub webhook once for tag builds to arrive (Settings shows the URL).
#
# Signing is done by the script steps below, NOT by an `environment.ios_signing`
# block: that block only looks up files uploaded to Codemagic's own "Code
# signing identities" store (nothing is there) and fails before any script
# runs -- "No matching profiles found for bundle identifier ...".
workflows:
  # Sideloadable debug APK -- no Google Play account, no Android Studio, no
  # signing. Start it manually in Codemagic, then open the artifact link ON THE
  # PHONE to install (Android will ask to allow installs from the browser once).
  android-debug-apk:
    name: Flapp Android -> debug APK
    # The macOS image also carries the Android SDK and Java, and it is the
    # instance the free plan grants -- linux_x2 is refused there.
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24.13.0
      java: 21
    triggering:
      events: []
    scripts:
      - name: Build web bundle
        script: |
          cd mobile
          npm ci
          npm run check:native
          node scripts/sync-www.mjs
      - name: Capacitor sync
        script: |
          cd mobile
          npx cap sync android
      - name: Build debug APK
        script: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk

  # The Play release: a SIGNED App Bundle, which is the only thing Play accepts.
  #
  # One-time setup (Artur):
  #   1. Codemagic -> Teams -> Code signing identities -> Android keystores:
  #      upload secrets/android/flapp-upload.jks, reference name  flapp_upload ,
  #      keystore password / key alias / key password from
  #      secrets/android/KEYSTORE.md. Codemagic then exports CM_KEYSTORE_PATH,
  #      CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD, which
  #      mobile/android/app/build.gradle reads (see its header).
  #   2. Nothing else: the AAB comes back as a build artifact and goes to
  #      Play Console -> Testing -> Internal testing -> Create new release ->
  #      upload. Two minutes by hand, and it keeps the first release free of a
  #      service account.
  #
  # Automating the upload later (worth it from the third release or so):
  #   Google Cloud -> IAM -> Service accounts: create one, grant it access in
  #   Play Console -> Users and permissions (Release manager on this app only),
  #   download the JSON key, add it to Codemagic -> Teams -> Integrations ->
  #   Google Play, then uncomment the publishing block at the end.
  android-release:
    name: Flapp Android -> signed AAB
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24.13.0
      java: 21
      android_signing:
        - flapp_upload
    # Same tag as the iOS workflow: one `scripts/mobile-release.sh` sends both
    # stores the same bundle of the SPA, so the two apps cannot drift apart.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'mobile/*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Build web bundle
        script: |
          cd mobile
          npm ci
          npm run check:native      # bundle id, icons, versionCode, signing, insets
          node scripts/sync-www.mjs
      - name: Capacitor sync
        script: |
          cd mobile
          npx cap sync android
      - name: Build signed AAB
        script: |
          cd mobile/android
          chmod +x gradlew
          # Play refuses a versionCode it has seen; $PROJECT_BUILD_NUMBER is
          # unique and monotonic per app. versionName stays the marketing
          # version from build.gradle, so a run of test builds does not move
          # the version the listing shows.
          FLAPP_VERSION_CODE="$PROJECT_BUILD_NUMBER" ./gradlew bundleRelease
      - name: Confirm it is signed with the upload key
        script: |
          # An unsigned AAB builds without error and is rejected at upload, so
          # the check belongs here and not in the Play Console.
          AAB=mobile/android/app/build/outputs/bundle/release/app-release.aab
          if unzip -l "$AAB" | grep -q 'META-INF/.*\.RSA'; then
            echo "OK: $AAB is signed"
          else
            echo "FAIL: $AAB has no signature -- was the keystore attached to"
            echo "      this workflow (environment.android_signing)?"
            exit 1
          fi
    artifacts:
      - mobile/android/app/build/outputs/bundle/**/*.aab
      - mobile/android/app/build/outputs/**/mapping.txt
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: false

  ios-testflight:
    name: Flapp iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore
    environment:
      node: 24.13.0
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing_creds   # CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: ca.clarivagroups.flapp
    # Built on a tag, not on every push. The app is a copy of the SPA taken
    # at build time, so it needs a rebuild to show UI changes -- but a build
    # per push is 12 min of Mac time each and the free plan has ~500 a month.
    # So: push a tag when the phone should catch up, from the repo root:
    #     scripts/mobile-release.sh           (tags mobile/<UTC date-time>, pushes it)
    # Server-side changes need no build; the installed app already talks to
    # the deployed API.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'mobile/*'
          include: true
      cancel_previous_builds: true
    scripts:
      # Runs first so a signing failure explains itself. The automatic signing
      # step is silent when the API key can't do its job; this prints exactly
      # which of the three usual causes it is (auth, role, missing App ID).
      - name: Verify App Store Connect access
        script: |
          set +e
          echo "== 0/3 Certificate private key is present =="
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "FAIL: CERTIFICATE_PRIVATE_KEY is not set. Add it to the"
            echo "      'ios_signing_creds' environment group (see header of this file)."
            exit 1
          fi
          echo "== 1/3 API key authenticates and can see the App ID =="
          app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "FAIL: the key could not authenticate or list App IDs."
            echo "  -> Check the Codemagic integration is named exactly 'appstore'"
            echo "     and its Key ID / Issuer ID / .p8 match the key in App Store Connect."
            exit 1
          fi
          echo "== 2/3 Distribution certificates on the account =="
          certs=$(app-store-connect certificates list --type IOS_DISTRIBUTION 2>&1)
          rc=$?
          echo "$certs"
          if [ $rc -ne 0 ]; then
            echo "FAIL: the key cannot read certificates -> its role is too low."
            exit 1
          fi
          if ! echo "$certs" | grep -qi "Certificate ID\|\"id\""; then
            echo "NOTE: no App Store distribution certificate exists yet. The 'Fetch"
            echo "      signing files' step creates it (--create). That needs an ADMIN"
            echo "      key -- if it fails with a permissions error, App Manager is the"
            echo "      reason: revoke the key, create one with 'Admin' access, re-add it"
            echo "      to Codemagic as 'appstore'."
          fi
          echo "== 3/3 Existing App Store profiles for this App ID =="
          app-store-connect profiles list --profile-type IOS_APP_STORE || true
          echo "OK: key works. If signing still fails, the profile/cert creation step is the culprit."
      - name: Build web bundle
        script: |
          cd mobile
          npm ci
          npm run check:native      # bundle id + iOS usage strings intact
          node scripts/sync-www.mjs
      - name: Capacitor sync (installs Pods)
        script: |
          cd mobile
          npx cap sync ios
      # Automatic signing through the App Store Connect API: creates the App
      # ID, the distribution certificate (from CERTIFICATE_PRIVATE_KEY) and the
      # App Store profile if they don't exist yet, then reuses them.
      - name: Fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: Build signed IPA
        script: |
          xcode-project use-profiles
          # TestFlight rejects a build number it has already seen; the Codemagic
          # build index is unique and monotonic, so it becomes CFBundleVersion.
          (cd mobile/ios/App && agvtool new-version -all "$BUILD_NUMBER")
          xcode-project build-ipa \
            --workspace mobile/ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal TestFlight groups get the build as soon as Apple has
        # processed it -- no beta review, no test-information form. External
        # review (submit_to_testflight: true) needs the form at
        # App Store Connect -> TestFlight -> Test Information; turn it on when
        # there are testers outside the team.
        submit_to_testflight: false
        beta_groups:
          - Internal
