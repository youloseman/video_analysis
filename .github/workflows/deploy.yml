# Deploy main to Railway.
#
# The Railway service is NOT connected to this GitHub repo (see DEPLOY.md), so
# merging to main ships nothing on its own -- that is how three PRs merged on
# 2026-07-30 without reaching production. Rather than depend on fixing the
# source connection in the Railway dashboard, this runs the same `railway up
# --ci` that every successful deployment of this project has used, just without
# a human having to remember.
#
# Requires one repository secret: RAILWAY_TOKEN.
#   Railway -> project video-analysis -> Settings -> Tokens -> create a PROJECT
#   token for the production environment, then GitHub -> Settings -> Secrets and
#   variables -> Actions -> New repository secret -> RAILWAY_TOKEN.
# A project token is scoped to this one project; an account token would let this
# workflow touch every project in the workspace.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual re-deploy without an empty commit

# Never let two deploys race. `cancel-in-progress: false` on purpose: cancelling
# a half-finished deploy is how you get a service stuck between two images.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The runner image is PINNED, not `ubuntu-latest`. GitHub moves that label to a
# new Ubuntu on a date of its choosing (26 lands 2026-10-19), and this workflow
# is the only thing that ships the product -- an OS bump should be a commit
# somebody made on purpose, not a Tuesday on which the deploy stops working.
# Bump it deliberately; the old image keeps working until it is retired.
#
# The action versions are the ones that run on Node 24. v4/v5 were forced onto
# it with a deprecation warning, which is the state just before they stop
# running at all.
jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'      # matches the Dockerfile base image
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Lint before the (slow) suite so an unused import fails in seconds rather
      # than after the ML stack has finished importing. `ruff` is pinned in
      # requirements-dev.txt, so this is the same version everyone runs locally.
      - name: Lint
        working-directory: backend
        run: python -m ruff check app tests

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Uploads the build context (see .dockerignore) and builds the Dockerfile
      # on Railway. --ci streams the build log and exits non-zero if it fails,
      # so a broken build fails this job instead of passing silently.
      - name: Deploy
        working-directory: .
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Through the environment, never interpolated into the run script.
          # A commit message is attacker-controllable text and `${{ }}` inside a
          # `run:` block is pasted straight into the shell, so a message
          # containing a quote and a semicolon would execute as a command.
          # It is also absent on workflow_dispatch, hence the fallback.
          COMMIT_MESSAGE: >-
            ${{ github.event.head_commit.message
                || format('manual deploy of {0}', github.sha) }}
        run: railway up --ci --service video-analysis -m "$COMMIT_MESSAGE"

      # The deploy command returning 0 means the image built and started, not
      # that the app is serving. /health is what railway.json already gates the
      # rollout on -- check it ourselves so a red X here means "production is
      # broken", not "the build finished".
      - name: Smoke-test /health
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://video-analysis-production-1f54.up.railway.app/health || true)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "attempt $i: HTTP $code"
            sleep 15
          done
          echo "::error::/health never returned 200 after the deploy"
          exit 1
