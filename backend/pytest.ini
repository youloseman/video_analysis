[pytest]
# Run from backend/: `python -m pytest`
testpaths = tests
asyncio_mode = auto
# Every async fixture in this suite is per-test (a fresh throwaway DB), which is
# also pytest-asyncio's default -- state it so the default changing does not
# silently start sharing databases between tests.
asyncio_default_fixture_loop_scope = function
# A test stuck this long prints every thread's stack and carries on being stuck:
# a hang on CI shows nothing at all otherwise, since the log is line-buffered and
# the dots of an unfinished line never reach it (2026-11-06, four hours of silence).
faulthandler_timeout = 300
filterwarnings =
    error::DeprecationWarning:app.*
markers =
    golden: runs the whole pipeline over a real clip and compares the result
        with a committed baseline. Slow (40-55 s per clip) and needs the
        gitignored footage, so it is deselected unless --golden or -m golden.
# scripts/ is importable so the golden test and the recorder share one table of
# clips; two copies of it would compare baselines recorded under other settings.
pythonpath = .
